{% extends "base.html" %}
{% block content %}
<div class="container text-center py-5" style="min-height: 70vh;">
  <div class="glass-card p-5 d-inline-block shadow-sm" style="max-width: 550px;">
    <div class="mb-4 text-warning">
      <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">404</h1>
    <h4 class="fw-semibold text-muted mb-3">Page Not Found</h4>
    <p class="text-muted mb-4">The page or food listing you are looking for does not exist or may have been relocated.</p>
    <a href="{{ url_for('home') }}" class="btn btn-success rounded-pill px-4 py-2 shadow-sm">
      <i class="fa-solid fa-house me-2"></i>Return Home
    </a>
  </div>
</div>
{% endblock %}
